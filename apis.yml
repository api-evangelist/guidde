aid: guidde
name: Guidde
description: 'Guidde is an AI-powered digital adoption and knowledge-capture platform
  that turns any on-screen workflow into professional step-by-step video documentation
  and how-to guides. Its Magic Capture browser extension, desktop, and mobile apps
  record a process, then AI generates a structured script, an AI voiceover (200+ voices),
  and an editable walkthrough that teams can translate into 50+ languages and embed
  wherever work happens. Guidde targets onboarding, customer education, support
  deflection, and internal process documentation for enterprises, and integrates with
  tools like Slack, Zendesk, Confluence, Notion, Salesforce, SharePoint, and ServiceNow.
  Guidde is backed by Norwest Venture Partners. This profile was enriched by the API
  Evangelist pipeline; Guidde does not currently publish a public developer API.'
